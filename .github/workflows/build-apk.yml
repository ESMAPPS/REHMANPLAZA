name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o RehmanPlaza-app.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleRelease --no-daemon
        working-directory: src
      - run: cp src/app/build/outputs/apk/release/app-release.apk RehmanPlaza.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Rehman Plaza v1.0.${{ github.run_number }}
          files: RehmanPlaza.apk
